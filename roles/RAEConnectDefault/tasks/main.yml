- name: Update and Upgrade
  ansible.builtin.cron:
    name: "update and upgrade"
    minute: "0"
    hour: "00"
    job: "apt update && apt upgrade"
    user: "root"
    state: absent
  become: true

- name: Create ansible cron log file
  ansible.builtin.file:
    path: /var/log/rae_connect_asnible.log
    state: touch
    owner: rae
    group: rae
    mode: '0644'
  become: true

- name: Ansible Update
  ansible.builtin.cron:
    name: "Ansible Update"
    minute: "*/5"
    hour: "*"
    # ------------------------------------- IMPORTANT! CHANGE BRANCH NAME WHEN MERGING! -VVV- ----------------------------------------------------
    job: "ansible-pull -U https://github.com/rae-corporation/RAEConnectAnsible.git -C real_test site.yml >> /var/log/rae_connect_asnible.log 2>&1"

- name: Install dotnet SDK
  ansible.builtin.apt:
    name: dotnet-sdk-6.0
    update_cache: yes
  become: true

- name: Install dotnet 9
  ansible.builtin.apt:
    name: aspnetcore-runtime-9.0
    update_cache: yes
  become: true



# DOES STAGE BRANCH FILE EXIST???
- name: Check if update staging file exists
  ansible.builtin.stat:
    path: /stageBranchEnabled.txt
  register: stage_branch

# DOES DEV BRANCH FILE EXIST???
- name: Check if update staging file exists
  ansible.builtin.stat:
    path: /devBranchEnabled.txt
  register: dev_branch

# IF NEITHER, COPY NORMAL UPDATE SCRIPT
- name: Copy Update.sh
  ansible.builtin.copy:
    src: ./Update.sh
    dest: /RAEConnect/update
  when: stage_branch.stat.exists == false && dev_branch.stat.exists == false

# IF STAGE EXISTS AND DEV DOESN'T, COPY STAGED UPDATE SCRIPT
- name: Copy StagedUpdate.sh
  ansible.builtin.copy:
    src: ./StagedUpdate.sh
    dest: /RAEConnect/update
  when: stage_branch.stat.exists == true && dev_branch.stat.exists == false

# IF DEV EXISTS, COPY DEV UPDATE SCRIPT
- name: Copy StagedUpdate.sh
  ansible.builtin.copy:
    src: ./DevUpdate.sh
    dest: /RAEConnect/update
  when: dev_branch.stat.exists == true


   
- name: Copy DashboardUpdate.sh
  ansible.builtin.copy:
    src: ./DashboardUpdate.sh
    dest: /ConnectDashboard/update
  become: true

- name: Install isc-kea
  ansible.builtin.apt:
    name: kea
    update_cache: yes
  become: true

- name: Copy kea-dhcp4.conf
  ansible.builtin.copy:
    src: ./kea-dhcp4.conf
    dest: /etc/kea/kea-dhcp4.conf
  become: true

- name: Check for string with grep
  shell: cat /etc/dhcp/dhclient.conf | grep -E "^[^#].*dhcp-client-identifier = hardware"
  register: grep_result
  ignore_errors: yes
  failed_when: grep_result.rc != 0 and grep_result.rc != 1
  
- name: Task if string found via grep
  shell: echo send dhcp-client-identifier = hardware\; >> /etc/dhcp/dhclient.conf
  when: grep_result.rc == 1

- name: Restart DHCP if dhclient.conf updated
  shell: dhclient -r && dhclient
  when: grep_result.rc == 1

